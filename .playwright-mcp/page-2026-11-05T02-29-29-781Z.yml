  - region "Project Components" [ref=f2e457]:
    - heading "Project Components" [level=2] [ref=f2e458]
    - generic [ref=f2e459]:
      - heading "JMeter Test Assets" [level=3] [ref=f2e460]
      - list [ref=f2e461]:
        - listitem [ref=f2e462]:
          - strong [ref=f2e463]: Page "Response Test.jmx"
          - text: — Main JMeter test plan that sends several GET and POST API requests to the portfolio site and JSONPlaceholder endpoints.
        - listitem [ref=f2e464]:
          - strong [ref=f2e465]: Portfolio endpoint checks
          - text: — Validates availability and response behavior of selected portfolio pages after GitHub updates are detected.
        - listitem [ref=f2e466]:
          - strong [ref=f2e467]: JSONPlaceholder requests
          - text: — Supplemental API calls used to demonstrate GET and POST request coverage within the same JMeter suite.
    - generic [ref=f2e468]:
      - heading "Jenkins Projects" [level=3] [ref=f2e469]
      - list [ref=f2e470]:
        - listitem [ref=f2e471]:
          - strong [ref=f2e472]: Jenkins-Portfolio-Trigger
          - text: — Polling Jenkins job that listens for changes in the portfolio GitHub repository and starts an empty successful build whenever updates are detected.
        - listitem [ref=f2e473]:
          - strong [ref=f2e474]: JMeter-Portfolio-Master
          - text: — Master Jenkins job that watches Jenkins-Portfolio-Trigger and starts the JMeter execution workflow after each successful trigger build.
    - generic [ref=f2e475]:
      - heading "Execution and Reporting Flow" [level=3] [ref=f2e476]
      - list [ref=f2e477]:
        - listitem [ref=f2e478]:
          - strong [ref=f2e479]: Download latest JMeter test plan
          - text: — The Jenkins master job pulls the latest version of the JMeter test file from the JMeter-Test GitHub repository before execution.
        - listitem [ref=f2e480]:
          - strong [ref=f2e481]: Run JMeter locally
          - text: — Jenkins launches the local JMeter installation in non-GUI mode and executes the API test plan against the configured targets.
        - listitem [ref=f2e482]:
          - strong [ref=f2e483]: Generate CSV results
          - text: — Execution results are saved into a CSV file for raw result tracking and troubleshooting.
        - listitem [ref=f2e484]:
          - strong [ref=f2e485]: Generate HTML report
          - text: — JMeter dashboard report output is generated as an HTML report for cleaner presentation of execution metrics and response summaries.
        - listitem [ref=f2e486]:
          - strong [ref=f2e487]: Send e-mail notification
          - text: — After the run completes, Jenkins sends an e-mail notification with the test results to bostchuk@gmail.com.
  - region "Automation Flow" [ref=f2e488]:
    - heading "Automation Flow" [level=2] [ref=f2e489]
    - list [ref=f2e490]:
      - listitem [ref=f2e491]: Jenkins-Portfolio-Trigger polls the portfolio GitHub repository for updates.
      - listitem [ref=f2e492]: When a portfolio change is detected, the trigger job performs a successful build.
      - listitem [ref=f2e493]: JMeter-Portfolio-Master watches the trigger project and starts after its success.
      - listitem [ref=f2e494]: The master job downloads the latest JMeter test plan from GitHub.
      - listitem [ref=f2e495]: Jenkins runs JMeter locally in non-GUI mode against the configured endpoints.
      - listitem [ref=f2e496]: CSV and HTML reports are generated for result review.
      - listitem [ref=f2e497]: An e-mail notification with the execution results is sent after completion.
  - region "Notes" [ref=f2e498]:
    - heading "Notes" [level=2] [ref=f2e499]
    - list [ref=f2e500]:
      - listitem [ref=f2e501]:
        - text: The project uses
        - strong [ref=f2e502]: two Jenkins jobs
        - text: to separate GitHub change detection from test execution logic.
      - listitem [ref=f2e503]:
        - text: The JMeter suite covers both
        - strong [ref=f2e504]: portfolio endpoint validation
        - text: and a public demo API for GET/POST request examples.
      - listitem [ref=f2e505]: HTML reporting makes the results easier to present during demos, while CSV output keeps the raw execution data available.
      - listitem [ref=f2e506]: The workflow is designed as a practical demonstration of continuous portfolio health checking with local tools.
