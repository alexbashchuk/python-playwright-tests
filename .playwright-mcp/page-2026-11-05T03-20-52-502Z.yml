    - generic [ref=e343]:
      - heading "io.github.alexbashchuk.base" [level=3] [ref=e344]
      - list [ref=e345]:
        - listitem [ref=e346]:
          - strong [ref=e347]: BaseUiTest.java
          - text: — Abstract base test. Creates Playwright + Chromium (Chrome channel), opens a browser with full-screen sizing, creates a fresh context/page, and navigates to the portfolio URL in @BeforeAll. Closes everything in @AfterAll.
        - listitem [ref=e348]:
          - strong [ref=e349]: AllurePlaywrightFailureExtension.java
          - text: "— JUnit 5 extension: on test failure it captures a full-page screenshot, saves it to target/screenshots, and attaches screenshot + URL + HTML to the Allure report."
        - listitem [ref=e350]:
          - strong [ref=e351]: ImageToTemplateMatcher.java
          - text: — Image validation utility using OpenCV template matching (TM_CCOEFF_NORMED). Compares captured modal screenshots vs template originals using a threshold percent (e.g., 80%).
        - listitem [ref=e352]:
          - strong [ref=e353]: AllureConsoleLogsExtension.java (optional)
          - text: — Optional extension (referenced in tests as commented @ExtendWith) intended to redirect logging into the Allure report.
    - generic [ref=e354]:
