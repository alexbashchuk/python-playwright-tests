          - text: "— Page Object Model for the portfolio Home page: selects an Experience block by aria-label, clicks 'Choose work description', validates Short Details/Long Story and the X close control, and opens certificate modals to screenshot the modal element for later image matching."
    - generic [ref=e359]:
