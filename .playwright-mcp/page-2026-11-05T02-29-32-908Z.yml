      - list [ref=f2e564]:
        - listitem [ref=f2e565]:
          - strong [ref=f2e566]: cypress/e2e/portfolio-home.cy.ts
          - text: — Main end-to-end test spec for validating portfolio home page behavior, navigation, and experience-card interactions.
        - listitem [ref=f2e567]:
          - strong [ref=f2e568]: cypress/e2e/portfolio-certifications.cy.ts
          - text: — End-to-end test spec focused on certifications-related flows and validation of certification UI behavior.
        - listitem [ref=f2e569]:
          - strong [ref=f2e570]: cypress/pages/HomePage.ts
          - text: — Reusable page object that centralizes locators and helper actions for the portfolio home page.
