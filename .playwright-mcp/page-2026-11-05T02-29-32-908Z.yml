  - region "Local Execution Flow" [ref=f2e589]:
    - heading "Local Execution Flow" [level=2] [ref=f2e590]
    - list [ref=f2e591]:
      - listitem [ref=f2e592]: Portfolio site is opened through the configured Cypress baseUrl.
      - listitem [ref=f2e593]: Tests execute in the selected local browser such as Chrome, Edge, Firefox, or Electron.
      - listitem [ref=f2e594]: Page object methods are used to locate experience-card controls and other portfolio elements.
      - listitem [ref=f2e595]: Assertions validate page visibility, button functionality, menu actions, and certification behavior.
      - listitem [ref=f2e596]: Allure result files are generated during execution and then converted into an HTML report for review.
  - region "CI CD Flow" [ref=f2e597]:
    - heading "CI/CD Flow" [level=2] [ref=f2e598]
    - list [ref=f2e599]:
      - listitem [ref=f2e600]: The portfolio repository is deployed to GitHub Pages through a GitHub Actions workflow.
      - listitem [ref=f2e601]: After successful deployment, the automation flow can trigger the Cypress project execution.
      - listitem [ref=f2e602]: The Cypress suite runs in GitHub Actions and publishes JUnit-style test results for CI visibility.
      - listitem [ref=f2e603]: This setup demonstrates how UI automation can be connected to a real deployment pipeline.
  - region "Key Project Highlights" [ref=f2e604]:
    - heading "Key Project Highlights" [level=2] [ref=f2e605]
    - list [ref=f2e606]:
      - listitem [ref=f2e607]: Built with Cypress and TypeScript for maintainable web UI automation.
      - listitem [ref=f2e608]: Uses page objects to keep selectors and test actions reusable.
      - listitem [ref=f2e609]: Supports local execution with Allure report generation for clearer result analysis.
      - listitem [ref=f2e610]: Supports CI execution with JUnit XML output for GitHub Actions visibility.
      - listitem [ref=f2e611]: Demonstrates cross-repository automation flow tied to portfolio deployment.
      - listitem [ref=f2e612]: Shows both local and CI execution in separate demo videos.
  - region "Notes" [ref=f2e613]:
    - heading "Notes" [level=2] [ref=f2e614]
    - list [ref=f2e615]:
      - listitem [ref=f2e616]:
        - text: The project focuses on
        - strong [ref=f2e617]: web UI automation
        - text: of my portfolio application rather than component-level unit testing.
      - listitem [ref=f2e618]:
        - text: "Reporting is split by use case:"
        - strong [ref=f2e619]: Allure
        - text: for rich local HTML analysis and
        - strong [ref=f2e620]: JUnit XML
        - text: for CI-friendly results in GitHub Actions.
      - listitem [ref=f2e621]: The CI/CD design is intentionally demo-friendly and shows how a personal portfolio project can be connected to automated post-deployment validation.
      - listitem [ref=f2e622]: The structure is compact, but it still demonstrates important automation engineering concepts such as reusable page objects, reporting integration, browser execution control, and workflow-based CI triggering.
