  - region "Project Components" [ref=e563]:
    - heading "Project Components" [level=2] [ref=e564]
    - generic [ref=e565]:
      - heading "JMeter Test Assets" [level=3] [ref=e566]
      - list [ref=e567]:
        - listitem [ref=e568]:
          - strong [ref=e569]: Page "Response Test.jmx"
          - text: — Main JMeter test plan that sends several GET and POST API requests to the portfolio site and JSONPlaceholder endpoints.
        - listitem [ref=e570]:
          - strong [ref=e571]: Portfolio endpoint checks
          - text: — Validates availability and response behavior of selected portfolio pages after GitHub updates are detected.
        - listitem [ref=e572]:
          - strong [ref=e573]: JSONPlaceholder requests
          - text: — Supplemental API calls used to demonstrate GET and POST request coverage within the same JMeter suite.
    - generic [ref=e574]:
      - heading "Jenkins Projects" [level=3] [ref=e575]
      - list [ref=e576]:
        - listitem [ref=e577]:
          - strong [ref=e578]: Jenkins-Portfolio-Trigger
          - text: — Polling Jenkins job that listens for changes in the portfolio GitHub repository and starts an empty successful build whenever updates are detected.
        - listitem [ref=e579]:
          - strong [ref=e580]: JMeter-Portfolio-Master
          - text: — Master Jenkins job that watches Jenkins-Portfolio-Trigger and starts the JMeter execution workflow after each successful trigger build.
    - generic [ref=e581]:
      - heading "Execution and Reporting Flow" [level=3] [ref=e582]
      - list [ref=e583]:
        - listitem [ref=e584]:
          - strong [ref=e585]: Download latest JMeter test plan
          - text: — The Jenkins master job pulls the latest version of the JMeter test file from the JMeter-Test GitHub repository before execution.
        - listitem [ref=e586]:
          - strong [ref=e587]: Run JMeter locally
          - text: — Jenkins launches the local JMeter installation in non-GUI mode and executes the API test plan against the configured targets.
        - listitem [ref=e588]:
          - strong [ref=e589]: Generate CSV results
          - text: — Execution results are saved into a CSV file for raw result tracking and troubleshooting.
        - listitem [ref=e590]:
          - strong [ref=e591]: Generate HTML report
          - text: — JMeter dashboard report output is generated as an HTML report for cleaner presentation of execution metrics and response summaries.
        - listitem [ref=e592]:
          - strong [ref=e593]: Send e-mail notification
          - text: — After the run completes, Jenkins sends an e-mail notification with the test results to bostchuk@gmail.com.
  - region "Automation Flow" [ref=e594]:
    - heading "Automation Flow" [level=2] [ref=e595]
    - list [ref=e596]:
      - listitem [ref=e597]: Jenkins-Portfolio-Trigger polls the portfolio GitHub repository for updates.
      - listitem [ref=e598]: When a portfolio change is detected, the trigger job performs a successful build.
      - listitem [ref=e599]: JMeter-Portfolio-Master watches the trigger project and starts after its success.
      - listitem [ref=e600]: The master job downloads the latest JMeter test plan from GitHub.
      - listitem [ref=e601]: Jenkins runs JMeter locally in non-GUI mode against the configured endpoints.
      - listitem [ref=e602]: CSV and HTML reports are generated for result review.
      - listitem [ref=e603]: An e-mail notification with the execution results is sent after completion.
  - region "Notes" [ref=e604]:
    - heading "Notes" [level=2] [ref=e605]
    - list [ref=e606]:
      - listitem [ref=e607]:
        - text: The project uses
        - strong [ref=e608]: two Jenkins jobs
        - text: to separate GitHub change detection from test execution logic.
      - listitem [ref=e609]:
        - text: The JMeter suite covers both
        - strong [ref=e610]: portfolio endpoint validation
        - text: and a public demo API for GET/POST request examples.
      - listitem [ref=e611]: HTML reporting makes the results easier to present during demos, while CSV output keeps the raw execution data available.
      - listitem [ref=e612]: The workflow is designed as a practical demonstration of continuous portfolio health checking with local tools.
