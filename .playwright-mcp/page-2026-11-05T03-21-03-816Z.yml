    - heading "JMeter + Jenkins API Automation Project" [level=1] [ref=e529]
    - paragraph [ref=e530]: GitHub-triggered portfolio monitoring • Local Jenkins execution • JMeter API validation
  - region "Project Description" [ref=e531]:
    - heading "Project Description" [level=2] [ref=e532]
    - paragraph [ref=e533]:
      - text: This project demonstrates a local CI-style automation workflow built with
      - strong [ref=e534]: JMeter
      - text: and
      - strong [ref=e535]: Jenkins
      - text: . I created a JMeter test plan that sends several API requests to my portfolio site and to JSONPlaceholder, then published the test plan into a dedicated GitHub repository. Jenkins monitors my portfolio GitHub repository for changes and automatically starts the JMeter execution flow after each new successful trigger build.
    - paragraph [ref=e536]:
      - text: The automation downloads the latest JMeter test file from GitHub, runs the test locally, creates
      - strong [ref=e537]: CSV
      - text: and
      - strong [ref=e538]: HTML
      - text: reports, and then sends an e-mail notification with the execution results. This project is designed as a practical demo of lightweight API monitoring and continuous validation for portfolio updates.
