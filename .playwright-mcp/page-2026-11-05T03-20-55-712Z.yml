  - region "C# Project Files and Classes" [ref=e406]:
    - heading "C# Project Files and Classes" [level=2] [ref=e407]
    - generic [ref=e408]:
      - heading "Infrastructure.PreChecks" [level=3] [ref=e409]
      - list [ref=e410]:
        - listitem [ref=e411]:
          - strong [ref=e412]: Cli.cs
          - text: — Reusable command runner for external tools like adb, emulator, appium, and shell commands. Captures stdout/stderr, supports timeout handling, and kills hung processes safely.
        - listitem [ref=e413]:
          - strong [ref=e414]: AndroidChecks.cs
          - text: — Android SDK / adb related validation helpers used before startup so the test environment fails early if required Android tooling is missing or not reachable.
        - listitem [ref=e415]:
          - strong [ref=e416]: AppiumChecks.cs
          - text: — Pre-run validation for Appium availability and related prerequisites so the framework can confirm the Appium command chain is usable before trying to launch sessions.
        - listitem [ref=e417]:
          - strong [ref=e418]: EmulatorChecks.cs
          - text: — Checks whether the requested AVD exists by querying available emulator profiles and throws a clear error if the configured emulator is missing.
        - listitem [ref=e419]:
          - strong [ref=e420]: PortChecks.cs
          - text: — Resolves the requested Appium port or falls back to a free localhost port when the preferred one is already occupied.
    - generic [ref=e421]:
      - heading "Infrastructure.Utils" [level=3] [ref=e422]
      - list [ref=e423]:
        - listitem [ref=e424]:
          - strong [ref=e425]: AVDStart.cs
          - text: — Starts the Android emulator, waits until adb reports exactly one online emulator, verifies Android boot completion, and attempts device wake/unlock before tests begin.
        - listitem [ref=e426]:
          - strong [ref=e427]: AppiumServerStart.cs
          - text: — Starts the Appium server process, monitors startup output, waits until the server is responsive, and preserves recent log lines for easier diagnostics if startup fails.
        - listitem [ref=e428]:
          - strong [ref=e429]: EnvironmentBootstrap.cs
          - text: — Main orchestration layer that performs environment validation, starts the emulator, starts Appium, and returns the final runtime details needed by the tests.
        - listitem [ref=e430]:
          - strong [ref=e431]: ProcessCleanupOnce.cs
          - text: — One-time global cleanup utility that kills leftover emulator and Appium processes before the run starts, while using a mutex guard to avoid disrupting parallel environments.
    - generic [ref=e432]:
      - heading "Infrastructure.Tests" [level=3] [ref=e433]
      - list [ref=e434]:
        - listitem [ref=e435]:
          - strong [ref=e436]: GlobalSetup.cs
          - text: — NUnit [SetUpFixture] that runs once per suite, performs global cleanup, bootstraps the emulator and Appium server, and stores shared runtime values like Appium port and emulator serial.
        - listitem [ref=e437]:
          - strong [ref=e438]: BaseMobileTest.cs
          - text: — Abstract base test that creates the AndroidDriver session with Chrome mobile web capabilities, binds the driver to the bootstrapped emulator/Appium server, and opens the portfolio site before each test.
        - listitem [ref=e439]:
          - strong [ref=e440]: POM_LandingPage.cs
          - text: — Page Object Model for the portfolio landing page. Handles mobile scrolling/swiping, locates company experience blocks, opens work description menus, and validates Short Details / Long Story selection and the X close control.
        - listitem [ref=e441]:
          - strong [ref=e442]: ButtonsFunctionalityCheckTests.cs
          - text: — Parameterized NUnit test suite that validates access to the portfolio site and checks work-description button behavior across multiple company experience cards.
    - generic [ref=e443]:
      - heading "Repo Root / Support Files" [level=3] [ref=e444]
      - list [ref=e445]:
        - listitem [ref=e446]:
          - strong [ref=e447]: Drivers/chromedriver.exe
          - text: — Local ChromeDriver binary used by Appium for automating Chrome on the Android emulator.
        - listitem [ref=e448]:
          - strong [ref=e449]: BAT_AndroidEmulatorStart.bat / PS_AndroidEmulatorStart.ps1
          - text: — Helper scripts for starting the Android emulator outside or alongside the automated test workflow.
        - listitem [ref=e450]:
          - strong [ref=e451]: BAT_AppiumServerRunWithAllowances.bat
          - text: — Convenience script for launching Appium with required allowances/settings on Windows.
        - listitem [ref=e452]:
          - strong [ref=e453]: TEST_RUN.bat / Maximum dotnet test diagnostics.bat
          - text: — Batch helpers for executing the NUnit suite and collecting more verbose diagnostics during demo or troubleshooting runs.
        - listitem [ref=e454]:
          - strong [ref=e455]: nunit.runsettings
          - text: — Run settings file used to control NUnit / test execution behavior for the solution.
  - region "Framework Flow" [ref=e456]:
    - heading "Framework Flow" [level=2] [ref=e457]
    - list [ref=e458]:
      - listitem [ref=e459]: Global one-time cleanup removes ghost Appium and emulator processes.
      - listitem [ref=e460]: Environment checks validate AVD, Appium, Android tooling, and free port usage.
      - listitem [ref=e461]: Framework starts the Android emulator and waits for full device boot.
      - listitem [ref=e462]: Appium server starts and becomes reachable on the resolved localhost port.
      - listitem [ref=e463]: AndroidDriver opens Chrome on the emulator and navigates to my portfolio site.
      - listitem [ref=e464]: Parameterized NUnit tests validate work-description controls across experience cards.
  - region "Notes" [ref=e465]:
    - heading "Notes" [level=2] [ref=e466]
    - list [ref=e467]:
      - listitem [ref=e468]:
        - text: The framework is built for Android
        - strong [ref=e469]: mobile web
        - text: automation rather than native-app automation in its current form.
      - listitem [ref=e470]: "The environment bootstrap is a major part of the project: emulator startup, Appium startup, port resolution, adb readiness, and cleanup are all handled in code."
      - listitem [ref=e471]: The Page Object uses scrolling/swiping support because some portfolio elements are far down the mobile page and need to be brought into view before interaction.
      - listitem [ref=e472]: This project is designed as a demo-friendly automation run that shows realistic mobile infrastructure setup, not just isolated test methods.
