  - region "Local Execution Flow" [ref=e695]:
    - heading "Local Execution Flow" [level=2] [ref=e696]
    - list [ref=e697]:
      - listitem [ref=e698]: Portfolio site is opened through the configured Cypress baseUrl.
      - listitem [ref=e699]: Tests execute in the selected local browser such as Chrome, Edge, Firefox, or Electron.
      - listitem [ref=e700]: Page object methods are used to locate experience-card controls and other portfolio elements.
      - listitem [ref=e701]: Assertions validate page visibility, button functionality, menu actions, and certification behavior.
      - listitem [ref=e702]: Allure result files are generated during execution and then converted into an HTML report for review.
  - region "CI CD Flow" [ref=e703]:
    - heading "CI/CD Flow" [level=2] [ref=e704]
    - list [ref=e705]:
      - listitem [ref=e706]: The portfolio repository is deployed to GitHub Pages through a GitHub Actions workflow.
      - listitem [ref=e707]: After successful deployment, the automation flow can trigger the Cypress project execution.
      - listitem [ref=e708]: The Cypress suite runs in GitHub Actions and publishes JUnit-style test results for CI visibility.
      - listitem [ref=e709]: This setup demonstrates how UI automation can be connected to a real deployment pipeline.
  - region "Key Project Highlights" [ref=e710]:
    - heading "Key Project Highlights" [level=2] [ref=e711]
    - list [ref=e712]:
      - listitem [ref=e713]: Built with Cypress and TypeScript for maintainable web UI automation.
      - listitem [ref=e714]: Uses page objects to keep selectors and test actions reusable.
      - listitem [ref=e715]: Supports local execution with Allure report generation for clearer result analysis.
      - listitem [ref=e716]: Supports CI execution with JUnit XML output for GitHub Actions visibility.
      - listitem [ref=e717]: Demonstrates cross-repository automation flow tied to portfolio deployment.
      - listitem [ref=e718]: Shows both local and CI execution in separate demo videos.
  - region "Notes" [ref=e719]:
    - heading "Notes" [level=2] [ref=e720]
    - list [ref=e721]:
      - listitem [ref=e722]:
        - text: The project focuses on
        - strong [ref=e723]: web UI automation
        - text: of my portfolio application rather than component-level unit testing.
      - listitem [ref=e724]:
        - text: "Reporting is split by use case:"
        - strong [ref=e725]: Allure
        - text: for rich local HTML analysis and
        - strong [ref=e726]: JUnit XML
        - text: for CI-friendly results in GitHub Actions.
      - listitem [ref=e727]: The CI/CD design is intentionally demo-friendly and shows how a personal portfolio project can be connected to automated post-deployment validation.
      - listitem [ref=e728]: The structure is compact, but it still demonstrates important automation engineering concepts such as reusable page objects, reporting integration, browser execution control, and workflow-based CI triggering.
