      - list [ref=e661]:
        - listitem [ref=e662]:
          - strong [ref=e663]: cypress.config.js
          - text: — Main Cypress configuration file. Sets browser viewport size, baseUrl for the portfolio site, JUnit reporting, and Allure reporter integration.
        - listitem [ref=e664]:
          - strong [ref=e665]: package.json
          - text: — Defines Cypress and Allure commands for opening the runner, running tests, and generating or opening Allure reports.
        - listitem [ref=e666]:
          - strong [ref=e667]: cypress/tsconfig.json
          - text: — TypeScript configuration for Cypress test code and support files.
    - generic [ref=e668]:
      - heading "Test Layer" [level=3] [ref=e669]
      - list [ref=e670]:
        - listitem [ref=e671]:
          - strong [ref=e672]: cypress/e2e/portfolio-home.cy.ts
          - text: — Main end-to-end test spec for validating portfolio home page behavior, navigation, and experience-card interactions.
        - listitem [ref=e673]:
          - strong [ref=e674]: cypress/e2e/portfolio-certifications.cy.ts
          - text: — End-to-end test spec focused on certifications-related flows and validation of certification UI behavior.
        - listitem [ref=e675]:
          - strong [ref=e676]: cypress/pages/HomePage.ts
          - text: — Reusable page object that centralizes locators and helper actions for the portfolio home page.
