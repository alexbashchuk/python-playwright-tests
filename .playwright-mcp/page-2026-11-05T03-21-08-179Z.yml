  - region "Project Description" [ref=e620]:
    - heading "Project Description" [level=2] [ref=e621]
    - paragraph [ref=e622]:
      - text: This project demonstrates an end-to-end automation framework built with
      - strong [ref=e623]: Cypress and TypeScript
      - text: for testing my GitHub-hosted portfolio website. The framework uses a
      - strong [ref=e624]: Page Object Model
      - text: approach for reusable locators and cleaner test maintenance, supports
      - strong [ref=e625]: local browser execution
      - text: ", and produces both"
      - strong [ref=e626]: Allure HTML reports
      - text: for local analysis and
      - strong [ref=e627]: JUnit XML results
      - text: for CI visibility.
    - paragraph [ref=e628]:
      - text: In addition to local execution, this demo also shows a
      - strong [ref=e629]: GitHub Actions CI/CD integration
      - text: where my portfolio repository deployment flow is connected to automated Cypress execution. This creates a realistic example of how UI tests can be used as a lightweight post-deployment quality gate for a live web project.
